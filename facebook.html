<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook</title>
    <style>
      div {
        height: 323px;
        width: 200px;
        margin-right: 15px;
        margin-top: 10px;
        margin-bottom: 10px;
        margin-left: 10px;
        border: solid rgb(235, 233, 233);
        display: inline-block;
      }
      img {
        width: 200px;
        height: auto;
        padding-left: 0;
      }
      p {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        margin-left: 5px;
      }
      .a {
        font-size: 12px;
        font-weight: bold;
        margin-top: 4px;
        margin-bottom: 3px;
      }
      .b {
        font-size: 10px;
        margin-bottom: 5px;
      }
      button {
        color: white;
        background-color: rgb(0, 94, 255);
        padding-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px;
        padding-top: 5px;
        border: none;
        border-radius: 5px;
        margin-left: 5px;
      }
      button:hover {
        color: rgb(0, 94, 255);
        background-color: white;
        border: solid whitesmoke;
      }
      .c {
        font-size: 12px;
        font-weight: bold;
        margin-top: 4px;
        margin-bottom: 3px;
      }
      .d {
        font-size: 10px;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="first">
      <img src="blackguy.png" alt="Confident Studio Portrait of a Young Man" />
      <p class="a">Leroy</p>
      <p class="b">4 mutual friends</p>
      <a href="https://www.facebook.com" target="_blank"
        ><button>Add Friend</button></a
      >
    </div>
    <div>
      <img src="waveone.png" alt="Approachable Wavy-Haired Studio Portrait" />
      <p class="c">Damian</p>
      <p class="d">9 mutual friends</p>
      <a href="https://www.facebook.com" target="_blank"
        ><button>Add Friend</button></a
      >
    </div>
    <div>
      <img src="wavetwo.png" alt="Confident Studio Portrait of a Young Man" />
      <p class="c">Micheal</p>
      <p class="d">3 mutual friends</p>
      <a href="https://www.facebook.com" target="_blank"
        ><button>Add Friend</button></a
      >
    </div>
  </body>
</html>
